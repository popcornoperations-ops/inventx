version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: inventx-postgres
    environment:
      POSTGRES_USER: inventx
      POSTGRES_PASSWORD: inventx
      POSTGRES_DB: inventx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventx"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:

